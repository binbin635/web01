<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人名片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- 头像区 -->
    <div class="avatar">
      <span class="avatar-initial">彬</span>
    </div>

    <!-- 姓名与职位 -->
    <h1 class="name">冯彬</h1>
    <p class="title">前端高级开发工程师</p>

    <!-- 一句话简介 -->
    <p class="tagline">热爱技术 · 追求极致 · 乐于分享</p>

    <hr class="divider">

    <!-- 联系方式 -->
    <ul class="contact">
      <li>
        <span class="icon">📞</span>
        <span class="label">电话</span>
        <a href="tel:13800000000">138-0000-0000</a>
      </li>
      <li>
        <span class="icon">✉️</span>
        <span class="label">邮箱</span>
        <a href="mailto:zhangsan@example.com">zhangsan@example.com</a>
      </li>
      <li>
        <span class="icon">📍</span>
        <span class="label">地址</span>
        <span>北京市朝阳区</span>
      </li>
      <li>
        <span class="icon">🌐</span>
        <span class="label">网站</span>
        <a href="https://zhangsan.example.com" target="_blank" rel="noopener">zhangsan.example.com</a>
      </li>
    </ul>
  </main>

  <footer class="footer">给我一个名片 · 静待联系 😊</footer>
</body>
</html>
